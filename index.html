<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Spectalyzer - The way of special care" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <title>Spectalyzer - The way of special care</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      document.body.innerHTML = '<div style="padding:20px;color:red;background:#fee"><h3>Global Error</h3><p>' + message + '</p><pre>' + (error && error.stack) + '</pre></div>';
      return true;
    };
    window.addEventListener('unhandledrejection', function(event) {
      document.body.innerHTML = '<div style="padding:20px;color:red;background:#fee"><h3>Unhandled Promise Rejection</h3><p>' + event.reason + '</p></div>';
    });
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
